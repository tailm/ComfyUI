# ComfyUI 模型加载优化配置
# 针对 AMD Ryzen 9 7950X + RTX 4070 Ti SUPER 16GB 优化

# ============================================
# 模型缓存配置
# ============================================

model_cache:
  # 启用模型缓存
  enabled: true
  
  # 缓存大小 (MB) - 根据62GB内存设置
  # 建议设置为系统内存的5-10%
  cache_size_mb: 4096  # 4GB缓存
  
  # 缓存目录
  cache_dir: "models/cache"
  
  # 预加载常用模型
  preload_models: true
  
  # 预加载模型列表
  preload_list:
    - "checkpoints/*.safetensors"
    - "checkpoints/*.ckpt"
    - "loras/*.safetensors"
    - "vae/*.safetensors"
    - "embeddings/*.pt"
    - "embeddings/*.bin"

# ============================================
# 模型加载优化
# ============================================

model_loading:
  # 启用模型分片加载 (对于大模型)
  enable_sharding: true
  
  # 分片大小 (MB)
  shard_size_mb: 1024  # 1GB分片
  
  # 并行加载线程数
  # 根据16核CPU设置，使用8个线程进行并行加载
  parallel_load_threads: 8
  
  # 启用懒加载
  lazy_loading: true
  
  # 懒加载阈值 (MB) - 大于此值的模型使用懒加载
  lazy_load_threshold_mb: 2048  # 2GB
  
  # 启用内存映射文件
  use_mmap: true
  
  # 预分配缓冲区大小 (MB)
  prealloc_buffer_mb: 512

# ============================================
# GPU显存优化
# ============================================

gpu_optimization:
  # 显存分配策略
  memory_allocation: "high_performance"  # high_performance | balanced | memory_saving
  
  # FP16精度推理
  use_fp16: true
  
  # 启用TF32 (如果GPU支持)
  enable_tf32: true
  
  # 启用CUDA图优化
  enable_cuda_graphs: true
  
  # 最大并发推理数
  max_concurrent_inferences: 2
  
  # 模型卸载策略
  model_offload: "smart"  # smart | aggressive | disabled
  
  # 智能卸载阈值 (MB) - 当显存低于此值时开始卸载
  offload_threshold_mb: 1024  # 1GB
  
  # 保留显存 (MB) - 为系统保留的显存
  reserve_memory_mb: 1024  # 1GB

# ============================================
# CPU优化
# ============================================

cpu_optimization:
  # CPU线程配置
  # AMD Ryzen 9 7950X: 16核心/32线程
  # 建议使用物理核心数进行密集计算
  num_threads: 16
  
  # 线程亲和性
  enable_affinity: true
  
  # 线程池大小
  thread_pool_size: 16
  
  # 启用NUMA优化 (如果系统支持)
  enable_numa: true
  
  # 大页面支持
  enable_huge_pages: true
  
  # 内存分配器
  memory_allocator: "jemalloc"  # jemalloc | tcmalloc | system

# ============================================
# 推理优化
# ============================================

inference_optimization:
  # 批处理大小
  # RTX 4070 Ti SUPER 16GB可以处理较大的批次
  batch_size: 4
  
  # 启用动态批处理
  dynamic_batching: true
  
  # 最大批处理大小
  max_batch_size: 8
  
  # 启用流水线并行
  pipeline_parallel: false  # 单GPU不需要
  
  # 启用张量并行
  tensor_parallel: false  # 单GPU不需要
  
  # 启用KV缓存
  enable_kv_cache: true
  
  # KV缓存大小
  kv_cache_size_mb: 512
  
  # 启用注意力优化
  enable_attention_optimization: true
  
  # 使用Flash Attention (如果支持)
  use_flash_attention: true

# ============================================
# 图像生成优化
# ============================================

image_generation:
  # 图像尺寸限制
  max_width: 2048
  max_height: 2048
  
  # 默认图像尺寸
  default_width: 1024
  default_height: 1024
  
  # 启用图像缓存
  enable_image_cache: true
  
  # 图像缓存大小 (MB)
  image_cache_size_mb: 1024
  
  # 启用渐进式加载
  progressive_loading: true
  
  # 启用预览生成
  enable_preview: true
  
  # 预览质量
  preview_quality: 85  # 百分比

# ============================================
# 工作流优化
# ============================================

workflow_optimization:
  # 启用工作流缓存
  enable_workflow_cache: true
  
  # 工作流缓存大小
  workflow_cache_size: 50  # 保存最近50个工作流
  
  # 启用节点缓存
  enable_node_cache: true
  
  # 节点缓存大小
  node_cache_size: 1000
  
  # 启用并行节点执行
  enable_parallel_execution: true
  
  # 最大并行节点数
  max_parallel_nodes: 4
  
  # 启用依赖分析
  enable_dependency_analysis: true

# ============================================
# 监控和日志
# ============================================

monitoring:
  # 启用性能监控
  enable_performance_monitoring: true
  
  # 监控间隔 (秒)
  monitor_interval: 5
  
  # 记录GPU使用情况
  log_gpu_usage: true
  
  # 记录内存使用情况
  log_memory_usage: true
  
  # 记录推理时间
  log_inference_time: true
  
  # 性能日志文件
  performance_log: "logs/performance.log"
  
  # 启用性能分析
  enable_profiling: false  # 生产环境建议关闭
  
  # 分析输出目录
  profile_output_dir: "profiles"

# ============================================
# 高级优化
# ============================================

advanced_optimization:
  # 启用JIT编译
  enable_jit: true
  
  # JIT编译模式
  jit_mode: "performance"  # performance | memory
  
  # 启用算子融合
  enable_operator_fusion: true
  
  # 启用常量折叠
  enable_constant_folding: true
  
  # 启用内存共享
  enable_memory_sharing: true
  
  # 启用梯度检查点 (用于大模型)
  enable_gradient_checkpointing: false  # 推理时不需要
  
  # 启用量化 (如果支持)
  enable_quantization: false  # 需要模型支持
  
  # 量化类型
  quantization_type: "int8"  # int8 | int4 | fp8

# ============================================
# 特定模型优化
# ============================================

model_specific:
  # Stable Diffusion优化
  stable_diffusion:
    # 启用xformers优化
    enable_xformers: true
    
    # 启用注意力切片
    enable_attention_slicing: true
    
    # 切片大小
    attention_slice_size: 512
    
    # 启用VAE切片
    enable_vae_slicing: true
    
    # VAE切片大小
    vae_slice_size: 512
    
    # 启用模型CPU卸载
    enable_cpu_offload: false  # 16GB显存足够，不需要卸载
    
    # 启用序列CPU卸载
    enable_sequential_cpu_offload: false

  # ControlNet优化
  controlnet:
    # 启用ControlNet缓存
    enable_cache: true
    
    # 缓存大小
    cache_size: 10
    
    # 启用预处理器优化
    enable_preprocessor_optimization: true

  # LoRA优化
  lora:
    # 启用LoRA缓存
    enable_cache: true
    
    # 最大并发LoRA数
    max_concurrent_loras: 4
    
    # LoRA合并优化
    enable_lora_merge_optimization: true

# ============================================
# 环境特定配置
# ============================================

environment:
  # 开发环境
  development:
    log_level: "DEBUG"
    enable_profiling: true
    enable_debug_tools: true
    
  # 生产环境
  production:
    log_level: "INFO"
    enable_profiling: false
    enable_debug_tools: false
    
  # 测试环境
  testing:
    log_level: "WARNING"
    enable_profiling: false
    enable_debug_tools: true

# ============================================
# 故障排除
# ============================================

troubleshooting:
  # 内存不足时的回退策略
  out_of_memory_fallback:
    # 启用自动降级
    enable_auto_downgrade: true
    
    # 降级顺序
    downgrade_order:
      - "reduce_batch_size"
      - "enable_cpu_offload"
      - "enable_attention_slicing"
      - "reduce_image_size"
      - "switch_to_lowvram"
    
    # 最小批处理大小
    min_batch_size: 1
    
    # 最小图像尺寸
    min_image_width: 512
    min_image_height: 512
  
  # 性能监控告警
  performance_alerts:
    # GPU使用率告警阈值
    gpu_usage_threshold: 90  # 百分比
    
    # 内存使用率告警阈值
    memory_usage_threshold: 85  # 百分比
    
    # 推理时间告警阈值 (毫秒)
    inference_time_threshold: 10000  # 10秒
    
    # 启用自动优化
    enable_auto_optimization: true

# ============================================
# 配置应用说明
# ============================================

# 应用此配置的方法:
# 1. 将文件保存为 extra_model_paths.yaml 或 config.yaml
# 2. 在启动ComfyUI时指定配置文件
# 3. 或通过环境变量加载配置

# 示例启动命令:
# python main.py --config model_optimization_config.yaml --highvram --force-fp16

# 注意: 某些选项可能需要ComfyUI支持或特定插件
# 请根据实际需求调整参数