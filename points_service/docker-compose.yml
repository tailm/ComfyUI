version: '3.8'

services:
  redis:
    image: redis:7.0
    container_name: points-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - points-network

  points-service:
    build: .
    container_name: points-service
    ports:
      - "8000:8000"
      - "9090:9090"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./logs:/app/logs
      - ../user:/app/user
    depends_on:
      - redis
    networks:
      - points-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: points-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - points-network

  grafana:
    image: grafana/grafana:latest
    container_name: points-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - points-network

volumes:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  points-network:
    driver: bridge
